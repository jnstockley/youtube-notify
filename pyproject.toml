[project]
name = "youtube-notify"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14, <4.0"
license-files = ["LICENSE"]
authors = [
    { name = "Jack Stockley", email = "jack@jstockley.com"}
]
keywords = ["starter", "template", "python"]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "feedparser==6.0.12",
    "google-api-python-client==2.197.0",
    "pydantic[timezone]==2.13.4",
    "python-dotenv==1.2.2",
]
[project.urls]
Homepage = "https://github.com/jnstockley/youtube-notify"
Repository = "https://github.com/jnstockley/youtube-notify.git"
Issues = "https://github.com/jnstockley/youtube-notify/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
markers = [
    "integration: live tests that hit YouTube endpoints",
]
